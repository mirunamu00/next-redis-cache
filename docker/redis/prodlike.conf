# Production-like Redis configuration.
# Mirrors helm-chart/mirunamu/redis/values.yaml (commonConfiguration) of the reference deployment.
# maxmemory is passed on the command line by docker/compose.yml (NRC_PRODLIKE_MAXMEMORY, default 384mb).

# Test-only dummy password. Never reuse a real credential here.
requirepass test

# Keyspace notifications (expired / evicted events), as in production
notify-keyspace-events Exe

# Persistence: AOF with per-second fsync plus RDB snapshots
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
dir /data

# Cache-only instance: evict least recently used keys among those with a TTL
maxmemory-policy volatile-lru
