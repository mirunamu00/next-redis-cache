# Release (changesets). Publishing is gated (ROADMAP.md section 6.8): the release job needs the full CI
# matrix (ci.yml level=full) and the required chaos subset. A commit that fails either cannot publish.
#
# Required chaos subset: startup without Redis (C1, C9) and rolling update/rollback (C11, C12). C3
# (unresponsive Redis) and C7 (eviction pressure) join the subset when they are implemented.
# Trusted publishing (OIDC), SHA-pinned actions for the release job and Node 24 come in P1.
name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  gate:
    name: gate (ci level full)
    uses: ./.github/workflows/ci.yml
    with:
      level: full

  chaos:
    name: gate (chaos subset)
    uses: ./.github/workflows/chaos.yml
    with:
      files: tests/chaos/startup.test.ts tests/chaos/rolling.test.ts

  release:
    name: Release
    needs: [gate, chaos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
